name: DreamWorldEdit
version: '${project.version}'
main: org.mydreamduels.dreamworldedit.DreamWorldEdit
api-version: '1.21'
author: javacoder99
description: WorldEdit / FAWE style world editing for Paper, Folia and Spigot.
# Runs on Paper, Folia AND plain Spigot - see platform/PlatformSupport.
folia-supported: true
# Commands (//set, //copy, /brush ...) are registered at startup - see command/Commands.

permissions:
  dreamworldedit.*:
    description: Every DreamWorldEdit command, unlimited blocks
    default: op
    children:
      dreamworldedit.admin: true
      dreamworldedit.brush.use: true
      dreamworldedit.limit.unlimited: true
      dreamworldedit.zone.bypass: true
      dreamworldedit.zone.escape: true
      dreamworldedit.spawn.instant: true
      dreamworldedit.spawnfly: true
      dreamworldedit.doublejump: true
  dreamworldedit.admin:
    description: /dwe reload
    default: op
  dreamworldedit.brush.use:
    default: op
  dreamworldedit.command.spawn:
    description: /spawn
    default: true
  dreamworldedit.spawn.instant:
    description: /spawn without the countdown
    default: op
  dreamworldedit.zone.escape:
    description: Walk / teleport out of a no-escape zone (moss pit) alive
    default: op
  dreamworldedit.zone.bypass:
    description: Build and open chests inside protected zones (pvp/damage rules still apply)
    default: op
  dreamworldedit.spawnfly:
    description: /spawnfly - fly inside spawn fly areas (turns off when you leave). Give it to a rank with LuckPerms.
    default: op
    children:
      dreamworldedit.command.spawnfly: true
  dreamworldedit.doublejump:
    description: Double jump inside double jump areas. Give it to a rank with LuckPerms.
    default: op
  dreamworldedit.command.spawnflywand:
    description: /spawnflywand - make spawn fly areas (admin)
    default: op
  dreamworldedit.command.doublejumpwand:
    description: /doublejumpwand - make double jump areas (admin)
    default: op
  dreamworldedit.limit.unlimited:
    description: No block limit per edit (otherwise dreamworldedit.limit.<number> or limits.default)
    default: op
  # Each command: dreamworldedit.command.<name>, e.g. dreamworldedit.command.set,
  # dreamworldedit.command.copy, dreamworldedit.command.schem, dreamworldedit.command.brush
