# ============================================================
#  DreamWorldEdit - WorldEdit / FastAsyncWorldEdit style editing
#  for Paper, Folia and Spigot.
#
#  Every edit is split into small per-chunk jobs that run on the
#  thread owning that chunk (Folia region threads, or the main
#  thread on Paper/Spigot), a few per tick - so even huge edits
#  don't freeze the server.
# ============================================================

prefix: "&8[&dDWE&8] &r"

# Selection wand (//wand): left-click = position 1, right-click = position 2.
wand-item: WOODEN_AXE
# Show the selected box with particles for a few seconds.
visualize-selection: true

limits:
  # Max blocks per edit for players without dreamworldedit.limit.<n> / .unlimited
  default: 100000

history:
  # How many edits each player can //undo.
  size: 15

# Biggest radius for //sphere, //cyl, //drain, //fill...
max-radius: 100
# Biggest brush size.
max-brush-size: 25
butcher-default-radius: 50

performance:
  # Chunk jobs started per tick. Higher = faster edits, more load per tick.
  chunks-per-tick: 8
  # Max jobs running at once (mostly matters on Folia, where they run in parallel).
  max-in-flight: 64
  # Height of one job (a chunk is split into slabs this tall).
  slab-height: 64

schematics:
  # Also look here for //schem load / list (relative to the server folder),
  # so schematics you already have from WorldEdit/FAWE just work.
  extra-folders:
    - plugins/WorldEdit/schematics
    - plugins/FastAsyncWorldEdit/schematics

# ============================================================
#  Spawn  (/setspawn, /spawn, /delspawn)
# ============================================================
spawn:
  # Brand-new players start at the spawn.
  on-first-join: true
  # Everyone is sent to the spawn every time they join.
  on-every-join: false
  # Players who die come back at the spawn.
  respawn-at-spawn: true
  # true  = a player who slept in a bed / set a respawn anchor comes back THERE (vanilla).
  # false = everyone always comes back at the spawn.
  bed-respawn: true
  # Worlds whose deaths are left alone (e.g. an event world with its own respawn).
  skip-worlds: []
  # /spawn counts down this long on screen (moving or getting hurt cancels it). 0 = instant.
  # dreamworldedit.spawn.instant skips it.
  countdown-seconds: 5
  # The countdown on screen. {icon} = an item picture (Java sprite / Bedrock pack glyph),
  # {seconds} = seconds left.
  text:
    title: "&6&lTaraash&e&lMC"
    subtitle: "{icon} &eTeleporting to spawn in &f&l{seconds}&e..."
    arrived: "{icon} &aWelcome to spawn!"
    cancelled-title: "&c&lTeleport cancelled"
    cancelled-move: "{icon} &7You moved - stand still next time."
    cancelled-damage: "{icon} &7You got hurt - try again somewhere safe."
  messages:
    countdown: "&eTeleporting to spawn in &f{seconds}s&e - don't move."
    teleported: "&aWelcome back to spawn!"
    cancelled-move: "&cTeleport cancelled - you moved."
    cancelled-damage: "&cTeleport cancelled - you got hurt."
    not-set: "There's no spawn yet. An admin can set it with /setspawn."

# ============================================================
#  Protected zones  (/zone)  - select an area with //wand, then
#  /zone create spawn. A new zone blocks pvp, building, chests,
#  damage, hunger, monsters, explosions and fire; doors/buttons work.
#  /zone flag <zone> <rule> on|off changes a rule.
# ============================================================
zones:
  # When a rule stops a player they get a line in chat (MiniMessage; {zone} = the zone's name,
  # {player} = the player). "" = say nothing.
  messages:
    pvp: "<dark_gray>[</dark_gray><gradient:#5EEAD4:#4FA3FF><b>Protected</b></gradient><dark_gray>]</dark_gray> <#FF5C5C><b>PvP is disabled</b></#FF5C5C> <gray>- you can't fight inside <white>{zone}</white>.</gray>"
    build: "<dark_gray>[</dark_gray><gradient:#5EEAD4:#4FA3FF><b>Protected</b></gradient><dark_gray>]</dark_gray> <#FFB347><b>Building is disabled</b></#FFB347> <gray>- blocks can't be broken or placed in <white>{zone}</white>.</gray>"
    containers: "<dark_gray>[</dark_gray><gradient:#5EEAD4:#4FA3FF><b>Protected</b></gradient><dark_gray>]</dark_gray> <#FFB347><b>Containers are locked</b></#FFB347> <gray>- you can't open that in <white>{zone}</white>.</gray>"
    use: "<dark_gray>[</dark_gray><gradient:#5EEAD4:#4FA3FF><b>Protected</b></gradient><dark_gray>]</dark_gray> <#FFB347><b>Not allowed</b></#FFB347> <gray>- you can't use that in <white>{zone}</white>.</gray>"
    pearls: "<dark_gray>[</dark_gray><gradient:#5EEAD4:#4FA3FF><b>Protected</b></gradient><dark_gray>]</dark_gray> <#B98CFF><b>Ender pearls are disabled</b></#B98CFF> <gray>in <white>{zone}</white>.</gray>"
    drops: "<dark_gray>[</dark_gray><gradient:#5EEAD4:#4FA3FF><b>Protected</b></gradient><dark_gray>]</dark_gray> <#FFB347><b>Item drops are disabled</b></#FFB347> <gray>in <white>{zone}</white> - keep your items safe.</gray>"
  # The item icon in front of each message (Paper 1.21.9+, the game's own textures - no resource
  # pack). Any item/<name> or block/<name> texture.
  icons:
    pvp: "item/iron_sword"
    build: "item/iron_pickaxe"
    containers: "block/barrel_top"
    use: "item/oak_door"
    pearls: "item/ender_pearl"
    drops: "item/chest_minecart"
  sprite-icons: true
  # chat (default) or actionbar.
  message-where: chat
  # A player sees the same message at most once every this many seconds.
  message-cooldown-seconds: 3
